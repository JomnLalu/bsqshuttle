                content: attr(data-label);

                padding-bottom: 0.875rem;
            }
            .time-stop:nth-last-of-type(2) {
                border-bottom: none;
                padding-bottom: 0;
            }
            .time-stop::before {
                content: attr(data-label);
                font-size: 0.875rem;
                font-weight: 700;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

<script>
    const routesData = {
        kemanggisan: {
            title: "Route: BSQ ➔ Kijang ➔ Syahdan ➔ Anggrek",
            gridClass: "grid-kemanggisan",
            hasFilters: true,
            headers: ["Depart (BSQ)", "Kijang", "Syahdan", "Anggrek", "Information"],

            ],
            data: [

                { bsq: "06:30", kijang: "06:40", syahdan: "06:50", dest: "07:00", info: "S2", tags: [] },
                { bsq: "06:45", kijang: "--", syahdan: "--", dest: "07:15", info: "S4", tags: ["Bypass Anggrek"] },
                { bsq: "06:45", kijang: "06:55", syahdan: "07:05", dest: "07:15", info: "S5", tags: ["2 Units"] },
                { bsq: "07:00", kijang: "07:10", syahdan: "07:20", dest: "07:30", info: "S1", tags: [] },
                { bsq: "08:20", kijang: "08:30", syahdan: "08:40", dest: "09:00", info: "S1", tags: [] },
                { bsq: "08:30", kijang: "--", syahdan: "--", dest: "09:30", info: "S4", tags: ["Bypass Anggrek"] },
                { bsq: "08:30", kijang: "08:40", syahdan: "08:55", dest: "09:05", info: "S5", tags: ["2 Units"] },
                { bsq: "08:45", kijang: "08:55", syahdan: "09:05", dest: "09:10", info: "S2", tags: [] },
                { bsq: "09:00", kijang: "09:10", syahdan: "09:20", dest: "09:30", info: "S3", tags: [] },

                { bsq: "10:45", kijang: "10:55", syahdan: "11:05", dest: "11:15", info: "S5", tags: [] },
                { bsq: "11:00", kijang: "11:10", syahdan: "11:20", dest: "11:30", info: "S4", tags: [] },
                { bsq: "12:30", kijang: "12:40", syahdan: "12:50", dest: "13:10", info: "S1", tags: ["2 Units"] },
                { bsq: "12:30", kijang: "--", syahdan: "--", dest: "13:05", info: "S5", tags: ["Bypass Anggrek"] },
                { bsq: "12:45", kijang: "12:55", syahdan: "13:05", dest: "13:15", info: "S3", tags: [] },

                { bsq: "15:00", kijang: "15:10", syahdan: "15:20", dest: "15:30", info: "S5", tags: [] },
                { bsq: "16:15", kijang: "16:25", syahdan: "16:35", dest: "17:10", info: "S1", tags: [] },
                { bsq: "16:30", kijang: "16:45", syahdan: "16:55", dest: "17:20", info: "S4", tags: [] },
                { bsq: "16:45", kijang: "16:55", syahdan: "17:05", dest: "17:30", info: "S2", tags: [] },
                { bsq: "17:00", kijang: "17:15", syahdan: "17:30", dest: "17:45", info: "S3", tags: [] },

                { bsq: "18:50", kijang: "19:00", syahdan: "19:15", dest: "19:30", info: "S3", tags: [] }
            ]
        },
        alsut: {
            title: "Route: BSQ ➔ Alam Sutera (ASO)",
            gridClass: "grid-simple",
            hasFilters: false,
            headers: ["Depart (BSQ)", "Arrive (Alsut-ASO)", "Information"],
            notes: [
                "Due to the long distance, there are only 3 departures daily.",
                "Asterisk (*) tags mean the shuttle skips Binus ASO.",
                "Taman Anggrek Shuttle starts Sep 12, 2026 (canceled during holidays/exams)."
            ],
            data: [
                { bsq: "06:15", dest: "08:00", info: "(ELF) B 7993 SDA", tags: [] },
                { bsq: "10:15", dest: "13:30", info: "(ELF) B 7993 SDA", tags: ["Skip ASO"] },
                { bsq: "14:30", dest: "17:30", info: "(ELF) B 7993 SDA", tags: ["Skip ASO (Depart)"] }
            ]
        },
        jwc: {
            title: "Route: BSQ ➔ JWC & FX",
            gridClass: "grid-simple",
            hasFilters: false,
            headers: ["Depart (BSQ)", "Arrive (JWC-FX)", "Information"],
            notes: [
                "If roads are congested or there are events (Protests, Football), the shuttle will not go to FX.",
                "For FX pick-up points, please coordinate directly with the shuttle driver.",
                "Taman Anggrek Shuttle starts Sep 12, 2026 (canceled during holidays/exams)."
            ],
            data: [
                { bsq: "07:00", dest: "08:30", info: "(BUS) B 7289 IE", tags: [] },
                { bsq: "11:00", dest: "13:00", info: "(BUS) B 7289 IE", tags: [] },
                { bsq: "14:30", dest: "15:15", info: "(BUS) B 7289 IE", tags: [] },
                { bsq: "16:00", dest: "17:15", info: "(BUS) B 7289 IE", tags: [] }
            ]
        }
    };

    let activeRoute = 'kemanggisan';
    let currentFilter = 'All';

    function getCurrentTimeString() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        return `${hours}:${minutes}`;
    }

    function getStatusBuses() {
        const timeStr = getCurrentTimeString();
        const route = routesData[activeRoute];
        let currentBus = null;
        let nextBus = null;

        for (let i = 0; i < route.data.length; i++) {
            if (route.data[i].bsq > timeStr) {
                nextBus = route.data[i];
                currentBus = i > 0 ? route.data[i - 1] : null;
                break;
            }
        }
        if (!nextBus && route.data.length > 0) {
            currentBus = route.data[route.data.length - 1];
        }

        return { currentBus, nextBus, timeStr };
    }

    function renderStatusCards() {
        const container = document.getElementById('status-cards');
        const { currentBus, nextBus } = getStatusBuses();
        const isKemanggisan = activeRoute === 'kemanggisan';

        const createCardHTML = (bus, type, label) => {
            if (!bus) return `<div class="status-card ${type}"><div class="card-label">${label}</div><div class="card-time">--:--</div><div class="card-details">No buses available</div></div>`;
            
            let details = bus.info;
            if (isKemanggisan) {
                const destType = bus.kijang === '--' ? 'Direct to Anggrek' : 'Regular Route';
                details = `Bus ${bus.info.replace('S', '')} • ${destType}`;
            }

            return `
                <div class="status-card ${type}">
                    <div class="card-label">${label}</div>
                    <div class="card-time">${bus.bsq}</div>
                    <div class="card-details">${details}</div>
                </div>
            `;
        };

        container.innerHTML = `
            ${createCardHTML(currentBus, 'current', 'Departed / Current')}
            ${createCardHTML(nextBus, 'next', 'Next Departure')}
        `;
    }

    function renderHeaders() {
        const route = routesData[activeRoute];
        const headerContainer = document.getElementById('schedule-header');
        headerContainer.className = `schedule-header ${route.gridClass}`;
        headerContainer.innerHTML = route.headers.map(h => `<div>${h}</div>`).join('');
    }

    function renderSchedule() {
        const container = document.getElementById('schedule-body');
        const route = routesData[activeRoute];
        const { timeStr } = getStatusBuses();
        
        let filteredData = route.data;
        
        if (route.hasFilters) {
            filteredData = route.data.filter(row => {
                if (currentFilter === 'All') return true;
                if (currentFilter === 'Regular') return row.tags.length === 0;
                return row.tags.includes(currentFilter) || row.tags.some(t => t.includes(currentFilter));
            });
        }

        if (filteredData.length === 0) {
            container.innerHTML = `<div class="empty-state">No buses match the selected filter.</div>`;
            return;
        }

        let nextBusHighlighted = false;

        container.innerHTML = filteredData.map(row => {
            let rowClass = `schedule-row ${route.gridClass}`;
            
            if (!nextBusHighlighted && row.bsq > timeStr) {
                rowClass += " next-bus";
                nextBusHighlighted = true;
            }

            const tagsHtml = row.tags.map(tag => {
                const tagClass = tag.includes("Bypass") || tag.includes("Skip") ? "bypass" : "extra";
                return `<span class="tag ${tagClass}">${tag}</span>`;
            }).join('');

            const infoTag = activeRoute === 'kemanggisan' 
                ? `<span class="tag base">Bus ${row.info.replace('S', '')}</span>` 
                : `<span class="tag base" style="font-size:0.75rem">${row.info}</span>`;

            let colsHtml = `<div class="time-main" data-label="${route.headers[0]}">${row.bsq}</div>`;
            
            if (activeRoute === 'kemanggisan') {
                colsHtml += `
                    <div class="time-stop ${row.kijang === '--' ? 'no-stop' : ''}" data-label="Kijang">${row.kijang}</div>
                    <div class="time-stop ${row.syahdan === '--' ? 'no-stop' : ''}" data-label="Syahdan">${row.syahdan}</div>
                `;
            }
            
            colsHtml += `
                <div class="time-stop" data-label="${route.headers[route.headers.length-2]}">${row.dest}</div>
                <div class="tags">${infoTag}${tagsHtml}</div>
            `;

            return `<div class="${rowClass}">${colsHtml}</div>`;
        }).join('');
    }

    function renderNotes() {
        const container = document.getElementById('notes-section');
        const notes = routesData[activeRoute].notes;
        
        container.innerHTML = `
            <h3>Important Rules & Notes</h3>
            <ul class="notes-list">
                ${notes.map(note => `<li>${note}</li>`).join('')}
            </ul>
        `;
    }

    function setupInteractions() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                tabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                
                activeRoute = e.target.dataset.route;
                document.getElementById('route-subtitle').textContent = routesData[activeRoute].title;
                
                const filterSection = document.getElementById('filter-section');
                if (routesData[activeRoute].hasFilters) {
                    filterSection.classList.remove('hidden');
                } else {
                    filterSection.classList.add('hidden');
                }

                renderHeaders();
                renderStatusCards();
                renderSchedule();
                renderNotes();
            });
        });

        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderSchedule();
            });
        });
    }

    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('clock').textContent = `Current Time: ${timeString}`;
    }

    function init() {
        updateClock();
        setupInteractions();
        renderHeaders();
        renderStatusCards();
        renderSchedule();
        renderNotes();
        
        setInterval(() => {
            updateClock();
            renderStatusCards();
            renderSchedule();
        }, 60000);
    }

    init();
</script>

</body>
</html>
